<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador Examen Scrum Master</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --ok: #22c55e;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--bad); }
  .topbar {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    z-index: 10;
  }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 1.3rem;
    font-weight: 600;
  }
  .timer.warn { color: #f59e0b; }
  .timer.crit { color: var(--bad); }
  .progress { color: var(--muted); font-size: 0.9rem; }
  .options label {
    display: block;
    background: #16213a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .options label:hover { border-color: var(--accent); }
  .options input { margin-right: 10px; }
  .nav { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
  .jumpgrid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin-top: 20px;
  }
  .jumpgrid button {
    background: #16213a;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 0;
    font-size: 0.8rem;
  }
  .jumpgrid button.current { border-color: var(--accent); color: var(--text); }
  .jumpgrid button.answered { background: #14324a; color: var(--text); }
  .hidden { display: none; }
  .result-score { font-size: 2rem; font-weight: 700; margin: 6px 0 4px; }
  .result-detail { color: var(--muted); margin-bottom: 24px; }
  .qresult {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .qresult.ok { border-left: 4px solid var(--ok); }
  .qresult.fail { border-left: 4px solid var(--bad); }
  .qresult .ans { font-size: 0.9rem; margin-top: 6px; }
  .qresult .ans.your { color: var(--bad); }
  .qresult .ans.correct { color: var(--ok); }
  .center { text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <div id="start-screen">
    <h1>Simulador Examen Scrum Master</h1>
    <p class="sub">90 minutos · 90 preguntas de opción múltiple</p>
    <div class="card center">
      <p>Al iniciar arranca el cronómetro de 90:00. Al terminar (o agotar el tiempo) verás tu puntaje y las preguntas que fallaste con la respuesta correcta.</p>
      <button id="btn-start">Comenzar examen</button>
    </div>
  </div>

  <div id="quiz-screen" class="hidden">
    <div class="topbar">
      <div class="progress" id="progress-label"></div>
      <div class="timer" id="timer">90:00</div>
    </div>
    <div class="card">
      <div id="q-title" style="font-size:1.05rem; margin-bottom:16px; white-space:pre-wrap;"></div>
      <div class="options" id="q-options"></div>
    </div>
    <div class="nav">
      <button class="secondary" id="btn-prev">Anterior</button>
      <button class="danger" id="btn-finish">Finalizar examen</button>
      <button id="btn-next">Siguiente</button>
    </div>
    <div class="jumpgrid" id="jumpgrid"></div>
  </div>

  <div id="result-screen" class="hidden">
    <h1>Resultado</h1>
    <div class="card">
      <div class="result-score" id="result-score"></div>
      <div class="result-detail" id="result-detail"></div>
      <div id="result-list"></div>
    </div>
  </div>

</div>

<script>
const QUESTIONS = [{"title": "¿Cuál de los siguientes NO es un beneficio de usar Scrum para el desarrollo de productos y la entrega de proyectos?", "type": "MULTIPLE_CHOICE", "options": ["La transparencia lleva a un ambiente de trabajo abierto.", "La propiedad colectiva le permite a los miembros del equipo que asuman la propiedad del proyecto", "Se reduce la planificación detallada por adelantado, asegurando que exista un alcance que permite cambios a medida que avanza el proyecto", "La adaptabilidad se logra por medio de la entrega iterativa, haciendo que los proyectos puedan incorporar con más facilidad los cambios"], "correct_answer": ["Se reduce la planificación detallada por adelantado, asegurando que exista un alcance que permite cambios a medida que avanza el proyecto"]}, {"title": "¿Cuál de los siguientes NO es un factor que marca la diferencia entre el marco de trabajo de Scrum y el modelo de gestión tradicional de proyectos?", "type": "MULTIPLE_CHOICE", "options": ["El estilo de organización en Scrum es autoorganizado, mientras que en los modelos tradicionales es gestionado", "En Scrum, el énfasis está en las personas, mientras que en los modelos tradicionales está en las personas", "En Scrum, el retorno en la inversión solo se logra al final del proyecto, mientras que en los modelos tradicionales se logra a lo largo del proyecto", "En términos de calidad, Scrum se centra en el cliente, mientras que en los modelos tradicionales se centra en los procesosEn términos de calidad, Scrum se centra en el cliente, mientras que en los modelos tradicionales se centra en los procesos"], "correct_answer": ["En Scrum, el retorno en la inversión solo se logra al final del proyecto, mientras que en los modelos tradicionales se logra a lo largo del proyecto"]}, {"title": "¿Cuál de los siguientes enunciados sobre Scrum y la gestión tradicional de proyectos es VERDADERO?", "type": "MULTIPLE_CHOICE", "options": ["En Scrum, la planificación por adelantado es alta, mientras que en la gestión tradicional de proyectos es baja", "En Scrum, la medida del desempeño se basa en el cumplimiento de un plan, mientras que en la gestión tradicional del proyecto se basa en el valor del negocio", "En Scrum, la participación del cliente es alta a lo largo del proyecto, mientras que en la gestión tradicional de proyectos varía según el ciclo de vida del proyecto", "En Scrum, la garantía de calidad es un proceso centralizado, mientras que en la gestión tradicional de proyectos está centrada en el cliente"], "correct_answer": ["En Scrum, la participación del cliente es alta a lo largo del proyecto, mientras que en la gestión tradicional de proyectos varía según el ciclo de vida del proyecto"]}, {"title": "La empresa VMMetro de Nueva York está trabajando en el desarrollo de una aplicación móvil para rastrear a las motocicletas que transitan por las calles de la ciudad. ¿Cuál de las siguientes actividades NO se lleva a cabo al utilizar el marco de trabajo de Scrum para presentar el proyecto?", "type": "MULTIPLE_CHOICE", "options": ["La planificación detallada por adelantado se lleva a cabo cubriendo toda la duración del proyecto", "El equipo de desarrollo que trabaja en este proyecto se reúne diariamente durante 15 minutos para presentar los impedimentos que enfrenta durante el desarrollo del producto", "El Product Owner prioriza los requerimientos que ofrecen el mayor valor del negocio para que los desarrolle el Equipo Scrum", "Los clientes podrán elaborar sus requerimientos constantemente a lo largo del proyecto"], "correct_answer": ["La planificación detallada por adelantado se lleva a cabo cubriendo toda la duración del proyecto"]}, {"title": "¿Cuál de los siguientes roles principales de Scrum debe asumir los riesgos al nivel del sprint?", "type": "MULTIPLE_CHOICE", "options": ["Scrum Master", "Patrocinador", "Equipo Scrum", "Product Owner"], "correct_answer": ["Product Owner"]}, {"title": "¿Cuál de los siguientes artefactos ayuda a garantizar la transparencia en Scrum?\nA. Scrumboard\nB. Reunión de la visión del proyecto\nC. Plan del proyecto\nD. Paquete de trabajo", "type": "DROPDOWN", "options": ["A", "D", "C", "B"], "correct_answer": ["A"]}, {"title": "¿En cuál de las siguientes reuniones NO se aplica el concepto del Time-box?", "type": "MULTIPLE_CHOICE", "options": ["Daily Standup.", "Scrum de Scrums", "Reunión de planificación del sprint", "Revisión del sprint"], "correct_answer": ["Scrum de Scrums"]}, {"title": "¿Cuál de los siguientes no es un artefacto que asegure la transparencia en los proyectos?", "type": "MULTIPLE_CHOICE", "options": ["Declaración de la visión del proyecto", "Documentación del inicio del proyecto", "Backlog priorizado del producto", "Cronograma de planificación de la liberación"], "correct_answer": ["Documentación del inicio del proyecto"]}, {"title": "A continuación se enumeran las principales metas de un equipo autoorganizado. Identifique las opciones incorrectas:\n\nA. Estimar historias de usuario y asignarse tareas.\nB. Crear tareas en forma independiente.\nC. Actualizar conocimientos y habilidades constantemente.\nD. Agregar nuevos miembros al equipo cuando sean necesarios nuevos conocimientos.\nE. Aplicar conocimientos y experiencia previamente obtenido en el trabajo actual al ser un equipo multidisciplinario.", "type": "DROPDOWN", "options": ["A y B", "D", "B y C", "E"], "correct_answer": ["D"]}, {"title": "En un proyecto de Scrum, uno de los equipos sigue todas las dimensiones centrales de la colaboración. Los miembros del equipo son amigables y generalmente se llevan bien entre sí. ¿Cuál de las siguientes técnicas no contribuye al aumento en el conocimiento de los componentes, las actividades y la secuencia de los productos del proyecto que se deben desarrollar en el proyecto?", "type": "MULTIPLE_CHOICE", "options": ["Estructura de desglose del producto", "Análisis del valor ganado", "Estructura de desglose del trabajo", "Diagrama de flujo del producto"], "correct_answer": ["Análisis del valor ganado"]}, {"title": "Según lo que define la Guía del SBOK, ¿cuál de los siguientes NO es un principio de Scrum?", "type": "MULTIPLE_CHOICE", "options": ["Colaboración", "Desarrollo iterativo", "Gestión por etapas", "Priorización basada en valor"], "correct_answer": ["Gestión por etapas"]}, {"title": "Usted es Scrum Master en un proyecto para desarrollar una aplicación móvil. Usted sabe que el Time-boxing es un principio muy importante en Scrum. Como Scrum Master, identifique la reunión con el Time-box incorrecto:", "type": "MULTIPLE_CHOICE", "options": ["La reunión de planificación del sprint tiene un Time-box de preferencia de 8 horas en un sprint de 4 semanas", "El Daily Standup tiene un Time-box de 15 minutos", "La reunión de revisión del sprint tiene un Time-box de 8 horas en un sprint de un mes", "La reunión de retrospectiva del sprint tiene un Time-box de 4 horas en un sprint de un mes"], "correct_answer": ["La reunión de revisión del sprint tiene un Time-box de 8 horas en un sprint de un mes"]}, {"title": "El Control del proceso empírico depende de tres ideas principales. ¿Cuál de las siguientes NO es una de las tres ideas principales del Control del proceso empírico?", "type": "MULTIPLE_CHOICE", "options": ["Transparencia", "Inspección", "Asociación", "Adaptación"], "correct_answer": ["Asociación"]}, {"title": "¿Cuál no es una habilidad fundamental necesaria para que un Scrum Master sea eficaz?", "type": "MULTIPLE_CHOICE", "options": ["Habilidad para mantener un ambiente de trabajo apropiado", "Habilidad para operar como líder de apoyo", "Habilidad para trabajar en códigos complejos", "Habilidad para resolver problemas"], "correct_answer": ["Habilidad para trabajar en códigos complejos"]}, {"title": "Usted es el Scrum Master de un proyecto para desarrollar equipo de minería en zonas de alto riesgo. Lleva a cabo un Daily Standup con el Equipo Scrum y uno de los miembros del equipo responde tres preguntas. La información obtenida se utilizará para: \n\nA. Identificar problemas e impedimentos \nB. Asignar culpas por lapsos y fracasos \nC. Dar seguimiento y evaluar los avances\nD. Identificar oportunidades para mejorar en futuros sprints", "type": "DROPDOWN", "options": ["Solo A", "A y C", "B y D", "A y B"], "correct_answer": ["A y C"]}, {"title": "Éric fue nombrado Scrum Master en un proyecto para crear un aplicación móvil. ¿Cuál es su responsabilidad como Scrum Master?", "type": "MULTIPLE_CHOICE", "options": ["Aceptar o rechazar los entregables finales como terminados durante una reunión de revisión del sprint", "Coordinarse regularmente con los clientes para entender mejor sus requerimientos", "Asegurarse de que el Product Owner no haga ningún cambio en los criterios de aceptación de las historias de usuario a mitad de un sprint", "Es responsable del desarrollo de los entregables o del producto según los especificado por el Product Owner"], "correct_answer": ["Asegurarse de que el Product Owner no haga ningún cambio en los criterios de aceptación de las historias de usuario a mitad de un sprint"]}, {"title": "¿Cuál de los siguientes roles es necesario al escalar Scrum en grandes proyectos?", "type": "MULTIPLE_CHOICE", "options": ["Program Scrum Master", "Chief Program Master", "Portfolio Scrum Master", "Chief Scrum Master"], "correct_answer": ["Chief Scrum Master"]}, {"title": "¿Cuál de los siguientes enunciados sobre la Teoría X y la Teoría Y es CORRECTO?", "type": "MULTIPLE_CHOICE", "options": ["El Scrum Master y el Product Owner deben de adoptar la Teoría X a fin de asegurar el éxito del proyecto", "Tanto el Scrum Master como el Product Owner deben adoptar la Teoría Y para asegurar el éxito del proyecto", "El Scrum Master debe adoptar la Teoría Y, mientras que el Product Owner debe adoptar la Teoría X", "Tanto el Scrum Master como el Product Owner deben tener su propio método sin seguir las teorías X y Y"], "correct_answer": ["Tanto el Scrum Master como el Product Owner deben adoptar la Teoría Y para asegurar el éxito del proyecto"]}, {"title": "Marcos es el Scrum Master de un proyecto para reconstruir el sistema de agua potable y alcantarillado en la ciudad de Bogotá. ¿Cuál de las siguientes características NO es necesaria para que Marcos sea un exitoso Scrum Master?\n\nA. Directivo\nB. Perceptivo\nC. Intuitivo\nD. Experto en la materia", "type": "MULTIPLE_CHOICE", "options": ["A, C y D", "A y C", "B y C", "A y D"], "correct_answer": ["B y C"]}, {"title": "En un proyecto de Scrum, ¿cuál es una de las principales responsabilidades de un Equipo Scrum?", "type": "MULTIPLE_CHOICE", "options": ["Sugerir mejoras o cambios durante los procesos de Crear entregables y Realizar el Daily Standup", "Presentar solicitudes de cambio en un proyecto", "Evaluar el impacto de los problemas en los entregables del proyecto", "Comunicarse con los interesados del negocio sobre los elementos del backlog del producto"], "correct_answer": ["Sugerir mejoras o cambios durante los procesos de Crear entregables y Realizar el Daily Standup"]}, {"title": "¿Cuál NO es una característica fundamental que se debe tomar en cuenta al seleccionar a los miembros del Equipo Scrum?", "type": "MULTIPLE_CHOICE", "options": ["Habilidades para resolver problemas", "Estilo de liderazgo de apoyo", "Disponibilidad", "Experto en la materia"], "correct_answer": ["Estilo de liderazgo de apoyo"]}, {"title": "\n\nLa siguiente tabla describe algunos roles de Scrum que juegan un papel importante en la justificación del negocio, así como sus responsabilidades. Seleccione la opción que corresponda a cada rol con su acción. \n\n\nRol de Scrum:\n\nI. Patrocinador\nII. Scrum Guidance Body\nIII. Clientes y usuarios\nIV. Scrum Master.\n\nAcción:\n\na. Facilita la creación de los entregables del proyecto; gestiona riesgos, cambios e impedimentos.\nb. Define la lista priorizada de requerimientos y las historias de usuario en el backlog priorizado del producto\nc. Aporta el financiamiento para el proyecto.\nd. Indica los lineamientos y las recomendaciones relacionadas a las técnicas de justificación del negocio y otros aspectos.", "type": "DROPDOWN", "options": ["I-b, II-c, III-a, IV-d", "I-a, II-c, III-b, IV-d", "I-c, II-d, III-b, IV-a", "I-d, II-b, III-c, IV-a"], "correct_answer": ["I-c, II-d, III-b, IV-a"]}, {"title": "La justificación continua del valor es una de las principales responsabilidades del Product Owner. En este contexto, ¿cuál de los siguientes enunciados es CORRECTO con relación a mantener la justificación del negocio en el portafolio?", "type": "MULTIPLE_CHOICE", "options": ["La justificación del negocio del portafolio se actualiza cuando se terminan los proyectos", "La justificación del negocio del portafolio se actualiza cuando se completa cada sprint en los proyectos de cada programa", "La justificación del negocio del portafolio se revisa constantemente día con día", "La justificación del negocio del portafolio se evalúa cuando se presenta un problema o un riesgo considerable"], "correct_answer": ["La justificación del negocio del portafolio se evalúa cuando se presenta un problema o un riesgo considerable"]}, {"title": "El Product Owner, al hacer la justificación continua de valor en los proyectos, debe tener conocimientos adecuados de los factores utilizados para determinar la justificación del negocio. ¿Cuál de los siguientes factores NO debe ser incluido en el presupuesto del proyecto y debe ser considerado en la evaluación de la inversión del proyecto?", "type": "MULTIPLE_CHOICE", "options": ["El costo de procuración de recursos para el proyecto", "El costo de gestión de problemas y riesgos del proyecto", "Los costos operativos y de mantenimiento de los productos del proyecto", "El costo de desarrollo del producto"], "correct_answer": ["Los costos operativos y de mantenimiento de los productos del proyecto"]}, {"title": "El Program Product Owner tiene la responsabilidad de crear la justificación del negocio en los programas. ¿Cuál de los siguientes pasos ayuda al Product Owner a determinar la justificación del negocio?", "type": "MULTIPLE_CHOICE", "options": ["Evaluar y presentar el caso de negocio, la justificación continua del valor y confirmar la realización de los beneficios", "Evaluar y presentar los principales riesgos, la justificación continua de necesidades, confirmar la realización de los costos", "Evaluar y presentar las escalas de tiempo del proyecto, la justificación continua del costo, confirmar la realización de necesidades", "Evaluar y presentar los beneficios del proyecto, la justificación continua de riesgos, confirmar la realización de valor"], "correct_answer": ["Evaluar y presentar el caso de negocio, la justificación continua del valor y confirmar la realización de los beneficios"]}, {"title": "Un Scrum Master es un rol importante que actúa como \"líder de apoyo\" del Equipo Scrum. ¿Cuál es una de las principales responsabilidades del Scrum Master?", "type": "MULTIPLE_CHOICE", "options": ["Ayudar a crear la declaración de la visión del proyecto", "Identificar los interesados del negocio del proyecto", "Asegurar la presencia de sustituidos del personal", "Definir los criterios de aceptación de las historias de usuario"], "correct_answer": ["Asegurar la presencia de sustituidos del personal"]}, {"title": "Un Scrum Master es un \"líder de apoyo\" responsable de asegurar que el Equipo Scrum entienda claramente los resultados deseados del proyecto. Para ello, debe verificar y confirmar que el equipo esté creando entregables que brindarán los beneficios y el valor definido al inicio del proyecto. ¿Cuál de las siguientes técnicas se utiliza para confirmar el valor?", "type": "MULTIPLE_CHOICE", "options": ["Demostrar prototipos y simular funcionalidades a los clientes", "Llevar a cabo sesiones donde los interesados del negocio y los miembros del Equipo principal de Scrum compartan abiertamente sus ideas", "Hacer ejercicios que motiven la investigación o la elaboración de prototipos para entender mejor los beneficios potenciales", "Representar en una gráfica los posibles resultados y reuniese con el equipo para priorizar los distintos beneficios con base en su evaluación subjetiva"], "correct_answer": ["Demostrar prototipos y simular funcionalidades a los clientes"]}, {"title": "El Scrum Master se coordina con el Product Owner y otros interesados del negocio para asegurar que se logren los beneficios del proyecto. ¿Cuál de las siguientes opciones es verdadera sobre el logro de los beneficios?", "type": "MULTIPLE_CHOICE", "options": ["Los beneficios de los proyectos de Scrum se pueden alcanzar durante el proceso de Demostrar y validar el sprint", "Los beneficios de los proyectos de Scrum se pueden alcanzar después de terminar el proceso de Retrospectiva de la liberación", "Los beneficios de los proyectos de Scrum se logran durante el proceso de Retrospectiva del sprint", "Los beneficios de los proyectos de Scrum se logran durante el proceso de Planificación de la liberación"], "correct_answer": ["Los beneficios de los proyectos de Scrum se pueden alcanzar después de terminar el proceso de Retrospectiva de la liberación"]}, {"title": "¿Cuál de los siguientes métodos permite estimar el valor obtenido de los proyectos?", "type": "MULTIPLE_CHOICE", "options": ["Tasa interna de retorno", "Tasa neta de retorno", "Tasa presente de retorno", "Tasa estimada de retorno"], "correct_answer": ["Tasa interna de retorno"]}, {"title": "Identifique el formato CORRECTO de una historia de usuario.", "type": "MULTIPLE_CHOICE", "options": ["Como (rol/personaje), yo debería (requerimiento) a fin de (beneficio)", "Como (rol/personaje), yo debería (beneficio) a fin de (requerimiento)", "Yo debería (beneficio) como (rol/persona) a fin de (requerimiento)", "Yo debería (requerimiento) como (beneficio) a fin de (rol/personaje)"], "correct_answer": ["Como (rol/personaje), yo debería (requerimiento) a fin de (beneficio)"]}, {"title": "¿Cuál de las siguientes opciones es la mejor definición de \"entregables aceptados\"?", "type": "MULTIPLE_CHOICE", "options": ["Entregables terminados por el Equipo Scrum en el sprint", "Entregables que han cumplido los criterios de aceptación y fueron aceptados por el Product Owner", "Entregables creados y aceptados por el Equipo Scrum como potencialmente enviables", "Entregables que han pasado las pruebas de calidad realizadas por el Equipo Scrum"], "correct_answer": ["Entregables que han cumplido los criterios de aceptación y fueron aceptados por el Product Owner"]}, {"title": "Como Scrum Master, usted debe asegurar que se mantenga un ritmo sostenible durante cada sprint. ¿Qué significa \"ritmo sostenible\"?", "type": "MULTIPLE_CHOICE", "options": ["Es el máximo esfuerzo que puede hacer un equipo en cada sprint para crear eficazmente los entregables del sprint", "El esfuerzo dedicado a cada sprint disminuye gradualmente a medida que el equipo se familiariza más con los entregables esperados", "El esfuerzo esperado en el sprint actual es similar al esfuerzo dedicado a los sprints anteriores. Es lo suficientemente lento para que el equipo se recupere de un sprint al siguiente y lo suficientemente rápido para cumplir las metas del negocio", "El esfuerzo dedicado en el sprint es directamente proporcional al costo incurrido en el sprint"], "correct_answer": ["El esfuerzo esperado en el sprint actual es similar al esfuerzo dedicado a los sprints anteriores. Es lo suficientemente lento para que el equipo se recupere de un sprint al siguiente y lo suficientemente rápido para cumplir las metas del negocio"]}, {"title": "¿Cuál de las siguientes afirmaciones sobre la calidad NO es correcta?", "type": "MULTIPLE_CHOICE", "options": ["El alance y la calidad de un proyecto específico se establece tomando en cuenta la necesidad del negocio que se espera satisfacer por medio del proyecto", "En Scrum, el backlog priorizado del producto recoge el alcance y los requisitos de calidad del proyecto", "La refinación constante del backlog priorizado del producto la lleva a cabo el Scrum Master después de consultar con el Equipo Scrum", "Dependiendo de los requerimientos del cliente, es posible que se descarten completamente las historias de usuario menos importantes"], "correct_answer": ["La refinación constante del backlog priorizado del producto la lleva a cabo el Scrum Master después de consultar con el Equipo Scrum"]}, {"title": "La empresa TechGen quiere implementar Scrum en un proyecto para desarrollar una aplicación móvil. El Product Owner ha presentado los criterios de aceptación para una de las historias de usuario priorizadas enlazada a la creación de la pasarela de pago. ¿Cuál de las siguientes afirmaciones NO es correcta?", "type": "MULTIPLE_CHOICE", "options": ["El Product Owner desarrolla los criterios de aceptación con base en su conocimiento de los requerimientos del cliente", "El Scrum Master comunica detalladamente la historia de usuario priorizada al Equipo Scrum", "Al comunicar la historia de usuario al Equipo Scrum, se busca también que esté de acuerdo", "Si el Product Owner acepta los entregables, la historia de usuario se considera terminada"], "correct_answer": ["El Scrum Master comunica detalladamente la historia de usuario priorizada al Equipo Scrum"]}, {"title": "En Scrum y en la gestión tradicional de proyectos existen diferencias en cómo se obtiene y se aplica la calidad. ¿Cuál de los siguientes enunciados es FALSO en este sentido?", "type": "MULTIPLE_CHOICE", "options": ["En la gestión tradicional de proyectos, después de que el usuario explica sus expectativas, el director del proyecto define tales expectativas en términos medibles", "En la gestión tradicional de proyectos, los cambios se pueden hacer solo por medio de un sistema formal de gestión de cambios", "En Scrum, el Scrum Master y el Equipo Scrum colaboran y deciden los criterios de aceptación de las historias de usuario", "En Scrum, el Equipo Scrum lleva a cabo el desarrollo del producto mediante breves iteraciones llamadas sprints"], "correct_answer": ["En Scrum, el Scrum Master y el Equipo Scrum colaboran y deciden los criterios de aceptación de las historias de usuario"]}, {"title": "¿Cuál de las siguientes actividades debe usted realizar como Scrum Master para lograr los objetivos de calidad?", "type": "MULTIPLE_CHOICE", "options": ["Mantener la calidad de un entregables actualizando el backlog del producto según los requisitos del cliente", "Debido a que el Equipo Scrum es multidisciplinario, delegar tareas apropiadas a los miembros que cuenten con las habilidades necesarias", "Durante un sprint, agregar nuevos miembros al equipo si los integrantes no cuentan con la habilidad necesaria", "Facilitar una cultura de \"primero el equipo\" cuando se trata de calidad"], "correct_answer": ["Facilitar una cultura de \"primero el equipo\" cuando se trata de calidad"]}, {"title": "Debido a que el Scrum Master actúa como líder de apoyo y trabaja con el Product Owner, el Equipo Scrum y con la organización, ¿cuál de los siguientes enunciados sobre las responsabilidades del Scrum Master es FALSO?", "type": "MULTIPLE_CHOICE", "options": ["El Scrum Master facilita y guía al Equipo Scrum en la adopción de los principios de Scrum", "El Scrum Master es fundamental para facilitar los cambios que aumenten la eficiencia del Equipo Scrum", "El Equipo Scrum es responsable de evaluar la viabilidad y garantizar la entrega del producto o servicio", "El Scrum Master debe asegurarse de que el Equipo Scrum entienda los elementos del backlog priorizado del producto"], "correct_answer": ["El Equipo Scrum es responsable de evaluar la viabilidad y garantizar la entrega del producto o servicio"]}, {"title": "¿Cuál de las siguientes opciones es responsabilidad del Scrum Master en el contexto de la gestión de cambios en los proyectos en los que se utiliza el framework de Scrum?", "type": "MULTIPLE_CHOICE", "options": ["Eliminar todos los cambios que pudieran afectar la calidad de los entregables y los procesos", "Facilitar la identificación, la evaluación y la priorización de las solicitudes de cambio del Product Owner", "Presentar solicitudes de cambio en un proyecto", "Aprobar cambios que sean modificados, eliminados o agregados según los requisitos del proyecto y comunicarlos al Equipo Scrum"], "correct_answer": ["Facilitar la identificación, la evaluación y la priorización de las solicitudes de cambio del Product Owner"]}, {"title": "¿Quién puede aprobar las solicitudes de cambio que se recomiendan en el proyecto?", "type": "MULTIPLE_CHOICE", "options": ["Product Owner", "Scrum Guidance Body", "Scrum Master", "Equipo Scrum"], "correct_answer": ["Product Owner"]}, {"title": "¿Cuál de las siguientes opciones puede ser considerada como un ejemplo de criterios de aceptación de historias de usuario?\n\nA. Todos los pedidos deben quedar guardados frecuentemente en la cuenta del usuario \nB. Todos los pedidos deben quedar guardados cada 5 segundos en la cuenta del usuario \nC. Todos los pedidos deben estar ordenados apropiadamente \nD. Todos los pedidos deben estar ordenados por fecha empezando por el más reciente", "type": "DROPDOWN", "options": ["A y B", "A y C", "B y C", "B y D"], "correct_answer": ["B y D"]}, {"title": "¿Cuál de los siguientes enunciados es verdadero sobre la gestión del cambio en Scrum?   \n\nA. El Scrum Master, puede sugerir cambios previa consulta con el Equipo Scrum \nB. El Scrum Master puede recomendar cambios con base en las lecciones de las reuniones re retrospectiva del sprint \nC. Los cambios que están por encima del nivel de tolerancia del Product Owner tal vez necesiten ayuda del Scrum Master que trabaja con el Product Owner \nD. El Scrum Master finaliza las solicitudes formales de cambio con el Equipo Scrum", "type": "DROPDOWN", "options": ["Solo D", "C y D", "A y B", "Solo A"], "correct_answer": ["A y B"]}, {"title": "¿Cuál de las siguientes opciones es verdadera con relación a la evaluación de las solicitudes de cambio?", "type": "MULTIPLE_CHOICE", "options": ["Los cambios sugeridos se registran como solicitudes de cambio y son aprobados y gestionados por el Scrum Guidance Body", "Los cambios que están por encima del nivel de tolerancia del Product Owner deben ser aprobados por los interesados del negocio", "En Scrum, bajo ninguna circunstancia se deben introducir cambios sino hasta que termine el sprint", "Los cambios que se agregan el backlog priorizado del producto los gestiona el Equipo Scrum"], "correct_answer": ["Los cambios que están por encima del nivel de tolerancia del Product Owner deben ser aprobados por los interesados del negocio"]}, {"title": "¿Cuál de los siguientes enunciados sobre el manejo de solicitudes de cambio en la entrega de proyectos con el marco de trabajo de Scrum es VERDADERO?", "type": "MULTIPLE_CHOICE", "options": ["Los cambios a nivel del portafolio no tienen ningún impacto en la entrega del producto", "La gestión de cambios se lleva a cabo en el proceso de priorización y se agregan historias de usuario al backlog priorizado del producto", "El procedimiento formal de control de cambios es fundamental en la entrega de proyectos por medio del marco de trabajo de Scrum", "La gestión de recursos del proyecto es independiente de la gestión de cambios al utilizar Scrum"], "correct_answer": ["La gestión de cambios se lleva a cabo en el proceso de priorización y se agregan historias de usuario al backlog priorizado del producto"]}, {"title": "Usted es el Scrum Master en un proyecto de generación de energía eléctrica. Mientras un sprint está en desarrollo, el Equipo Scrum lo convence de que el alcance del sprint debe cambiar. Usted saber que no se pueden agregar cambios al backlog del sprint cuando el sprint ya inició. ¿Cómo abordaría usted esta situación?", "type": "MULTIPLE_CHOICE", "options": ["Solicitarle al Product Owner que permita cambios en el backlog del sprint", "Solicitarle al Equipo Scrum que cancele el sprint y prepare uno nuevo", "Pedirle al Equipo Scrum que trabaje en los cambios durante el sprint en curso", "Recomendarle al Product Owner que le pida al Equipo Scrum que cancele el actual sprint y programe uno nuevo para incorporar los cambios"], "correct_answer": ["Recomendarle al Product Owner que le pida al Equipo Scrum que cancele el actual sprint y programe uno nuevo para incorporar los cambios"]}, {"title": "¿Qué sirve como radiador de información para comunicar información relacionada a los riesgos?", "type": "MULTIPLE_CHOICE", "options": ["Risk Burnup Chart", "Risk Burndown Chart", "Risk Progress Chart", "Risk Tracking Chart"], "correct_answer": ["Risk Burndown Chart"]}, {"title": "Debido a que el Scrum Master actúa como líder de apoyo y trabaja con el Product Owner, el Equipo Scrum y con la organización, ¿cuál de los siguientes enunciados sobre las responsabilidades del Scrum Master es FALSO?", "type": "MULTIPLE_CHOICE", "options": ["El Scrum Master facilita y guía al Equipo Scrum en la adopción de los principios de Scrum", "El Scrum Master es fundamental para facilitar los cambios que aumenten la eficiencia del Equipo Scrum", "El Equipo Scrum es responsable de evaluar la viabilidad y garantizar la entrega del producto o servicio", "El Scrum Master debe asegurarse de que el Equipo Scrum entienda los elementos del backlog priorizado del producto"], "correct_answer": ["El Equipo Scrum es responsable de evaluar la viabilidad y garantizar la entrega del producto o servicio"]}, {"title": "Como Scrum Master, usted debe entender cuáles son los riesgos y cómo manejarlos. ¿Cuál de las siguientes opciones es FALSA sobre la forma de definir los riesgos en el marco de trabajo de Scrum? ", "type": "MULTIPLE_CHOICE", "options": ["Un riesgo es un evento incierto que puede afectar los objetivos de un proyecto", "Todos los riesgos deben ser gestionados apropiadamente y a lo largo del ciclo de vida del proyecto", "Todos los riesgos tienen la misma probabilidad e impacto en el proyecto, independientemente de la naturaleza de su ocurrencia", "Los riesgos pueden tener efectos positivos y negativos en el proyecto"], "correct_answer": ["Todos los riesgos tienen la misma probabilidad e impacto en el proyecto, independientemente de la naturaleza de su ocurrencia"]}, {"title": "Como Scrum Master, usted colabora con el Product Owner para definir la actitud al riesgo de los interesados del negocio. ¿Qué debe de tomar en cuenta en este sentido?", "type": "MULTIPLE_CHOICE", "options": ["La causa del riesgo y el impacto", "Solo la proximidad y el impacto", "Solo la probabilidad y la proximidad", "La probabilidad, la proximidad y el impacto"], "correct_answer": ["La probabilidad, la proximidad y el impacto"]}, {"title": "En un proyecto hidroeléctrico, las afectaciones humanas y los daños a la propiedad causados por inundaciones y deslaves fueron identificados como posibles riesgos. ¿Cuál de las siguientes técnicas de evaluación de riesgos puede implementar el Equipo Scrum para evaluar los posibles riesgos y su impacto en los objetivos del proyecto?", "type": "MULTIPLE_CHOICE", "options": ["Matriz de probabilidad e impacto", "Árboles de probabilidad", "Análisis de Pareto", "Valor monetario esperado"], "correct_answer": ["Matriz de probabilidad e impacto"]}, {"title": "Como Scrum Master, usted debe conocer las técnicas de evaluación de riesgos que se utilizan para evaluar las probabilidades y el impacto de los riesgos en un proyecto. Seleccione la técnica de evaluación de riesgos incorrectamente relacionada a su objetivo.", "type": "MULTIPLE_CHOICE", "options": ["Valor monetario esperado: Producto del impacto monetario y probabilidad de riesgo", "Análisis de Pareto: Clasifica los riesgos por magnitud", "Matriz de probabilidad e impacto: El valor de los posibles eventos se utiliza para calcular el impacto general de la ocurrencia de riesgo", "Árboles de probabilidad: En una grafica se representa cada rama de cada posible resultado de los eventos potenciales"], "correct_answer": ["Matriz de probabilidad e impacto: El valor de los posibles eventos se utiliza para calcular el impacto general de la ocurrencia de riesgo"]}, {"title": "¿Cuál de los siguientes enunciados sobre la gestión de riesgos en un proyecto de Scrum es incorrecto?", "type": "MULTIPLE_CHOICE", "options": ["La naturaleza iterativa de Scrum con sus rápidas respuestas y ciclos de retroalimentación permite la detección oportuna de errores", "Los riesgos se pueden gestionar solo al nivel del proyecto, incluso están relacionados o se originaron en portafolios o programas", "El Risk Burndown Chart es una herramienta importante para comunicar a los interesados del negocio la información relacionada a los riesgos", "En Scrum se minimiza considerablemente el riesgo debido a la flexibilidad que existe al agregar o modificar requerimientos en cualquier momento del ciclo de vida del proyecto"], "correct_answer": ["Los riesgos se pueden gestionar solo al nivel del proyecto, incluso están relacionados o se originaron en portafolios o programas"]}, {"title": "Al gestionar riesgos en un proyecto, como Scrum Master, usted debe conocer cuáles son los roles responsables de actividades específicas de gestión de riesgos. Seleccione la combinación incorrecta.", "type": "MULTIPLE_CHOICE", "options": ["Interesados del negocio: Recogen y evalúan los riesgos del proyecto", "Equipo Scrum: Implementan actividades de gestión de riesgos según lo que aconseje el Product Owner", "Product Owner: Prioriza y comunica los riesgos a los equipos del programa y del portafolio", "Scrum Guidance Body: Presenta una orientación general para el procedimiento de gestión de riesgos"], "correct_answer": ["Interesados del negocio: Recogen y evalúan los riesgos del proyecto"]}, {"title": "El Scrum Master y el Product Owner evalúan los posibles riesgos que pudieran afectar los resultados del proyecto. Deben clasificar y organizar los riesgos identificados con base en sus similitudes. ¿Cuál de las siguientes técnicas de identificación de riesgos deben utilizar?", "type": "MULTIPLE_CHOICE", "options": ["Listas de verificación de riesgos", "Listas cortas de riesgos", "Tormenta de ideas", "Estructura de desglose de riesgos"], "correct_answer": ["Estructura de desglose de riesgos"]}, {"title": "¿Cuál de las siguientes opciones define mejor la \"probabilidad de riesgo\"?", "type": "MULTIPLE_CHOICE", "options": ["Rango de tiempo de la ocurrencia de riesgo", "Impacto del riesgo en los objetivos del proyecto", "Probabilidad de ocurrencia del riesgo", "Fuente o causa del riesgo"], "correct_answer": ["Probabilidad de ocurrencia del riesgo"]}, {"title": "Al hacer un análisis de costo-beneficio, el Product Owner de un proyecto determinó que el proyecto tiene un 45 % de probabilidades de incurrir en pérdidas de $800,000 debido a las últimas reformas agrarias. ¿Cuál de las siguientes técnicas utiliza el Product Owner para hacer el análisis de costo-beneficio?", "type": "MULTIPLE_CHOICE", "options": ["Valor monetario esperado", "Matriz de probabilidad e impacto", "Análisis de Pareto", "Estructura de desglose de riesgos"], "correct_answer": ["Valor monetario esperado"]}, {"title": "El Product Owner en un proyecto del cual usted es Scrum Master ha identificado situaciones de desastre, tales como terremotos y tsunamis como los posibles riesgos en un proyecto de comunicación transnacional marítima. Los interesados han sugerido que se tomen medidas para salvaguardar los cimientos de la infraestructura bajo el mar lo más pronto posible. También recomendaron que se prepare una reserva de contingencia que pudiera ser utilizada en caso de una situación de desastre. Esto es un ejemplo de:", "type": "MULTIPLE_CHOICE", "options": ["Mitigación de riesgos", "Priorización de riesgos", "Evasión de riesgos", "Evaluación de riesgos"], "correct_answer": ["Mitigación de riesgos"]}, {"title": "El Equipo Scrum trabaja en el desarrollo de un software para el mercado de valores. El equipo trabaja en una tecnología que nunca se ha utilizado anteriormente. Por ello, el equipo hace una investigación y un prototipo para entender mejor los posibles riesgos. Esto es un ejemplo de:", "type": "MULTIPLE_CHOICE", "options": ["Spike basado en riesgo", "Tormenta de ideas", "Aceptación de riesgos", "Mitigación de riesgos"], "correct_answer": ["Spike basado en riesgo"]}, {"title": "¿Cuál de las siguientes opciones es responsabilidad del Scrum Master en el contexto de la gestión de cambios en los proyectos en los que se utiliza el framework de Scrum?", "type": "MULTIPLE_CHOICE", "options": ["Eliminar todos los cambios que pudieran afectar la calidad de los entregables y los procesos", "Facilitar la identificación, la evaluación y la priorización de las solicitudes de cambio del Product Owner", "Presentar solicitudes de cambio en un proyecto", "Aprobar cambios que sean modificados, eliminados o agregados según los requisitos del proyecto y comunicarlos al Equipo Scrum"], "correct_answer": ["Facilitar la identificación, la evaluación y la priorización de las solicitudes de cambio del Product Owner"]}, {"title": "¿Cuál de los siguientes pares está INCORRECTAMENTE relacionado?", "type": "MULTIPLE_CHOICE", "options": ["Equipo coubicado: Salas de guerra", "Equipo coubicado: Paredes con información", "Equipo disperso: Videoconferencia", "Equipo disperso: Scrumboard manual"], "correct_answer": ["Equipo disperso: Scrumboard manual"]}, {"title": "¿Cuál de los siguientes factores no se necesitan tomar en cuenta durante la priorización de historias de usuario?", "type": "MULTIPLE_CHOICE", "options": ["Riesgo", "Valor", "Composición del equipo", "Dependencias"], "correct_answer": ["Composición del equipo"]}, {"title": "¿Cuál de uno de los procesos de la fase de inicio?", "type": "MULTIPLE_CHOICE", "options": ["Identificar al Scrum Master y a los interesados del negocio", "Comprometer historias de usuario", "Realizar el Daily Standup", "Crear entregables"], "correct_answer": ["Identificar al Scrum Master y a los interesados del negocio"]}, {"titl iva del sprint"], "correct_answer": ["Actualizar el backlog del sprint"]}];

const TOTAL_SECONDS = 90 * 60;
let order = [];
let answers = {};
let current = 0;
let timeLeft = TOTAL_SECONDS;
let timerId = null;
let finished = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function startQuiz() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  answers = {};
  current = 0;
  timeLeft = TOTAL_SECONDS;
  finished = false;

  document.getElementById("start-screen").classList.add("hidden");
  document.getElementById("quiz-screen").classList.remove("hidden");
  document.getElementById("result-screen").classList.add("hidden");

  buildJumpgrid();
  renderQuestion();
  timerId = setInterval(tick, 1000);
}

function tick() {
  timeLeft--;
  const timerEl = document.getElementById("timer");
  timerEl.textContent = fmtTime(Math.max(timeLeft, 0));
  timerEl.classList.toggle("warn", timeLeft <= 15 * 60 && timeLeft > 5 * 60);
  timerEl.classList.toggle("crit", timeLeft <= 5 * 60);
  if (timeLeft <= 0) {
    clearInterval(timerId);
    finishQuiz();
  }
}

function renderQuestion() {
  const qIndex = order[current];
  const q = QUESTIONS[qIndex];

  document.getElementById("progress-label").textContent = `Pregunta ${current + 1} de ${order.length}`;
  document.getElementById("q-title").textContent = q.title;

  const optsEl = document.getElementById("q-options");
  optsEl.innerHTML = "";
  q.options.forEach((opt, i) => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "opt";
    input.value = i;
    if (answers[qIndex] === i) input.checked = true;
    input.addEventListener("change", () => {
      answers[qIndex] = i;
      updateJumpgrid();
    });
    label.appendChild(input);
    label.appendChild(document.createTextNode(opt));
    optsEl.appendChild(label);
  });

  document.getElementById("btn-prev").disabled = current === 0;
  document.getElementById("btn-next").textContent = current === order.length - 1 ? "Ir a la última" : "Siguiente";
  updateJumpgrid();
}

function buildJumpgrid() {
  const grid = document.getElementById("jumpgrid");
  grid.innerHTML = "";
  order.forEach((_, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.addEventListener("click", () => {
      current = i;
      renderQuestion();
    });
    grid.appendChild(b);
  });
}

function updateJumpgrid() {
  const grid = document.getElementById("jumpgrid");
  [...grid.children].forEach((b, i) => {
    b.classList.toggle("current", i === current);
    b.classList.toggle("answered", order[i] in answers);
  });
}

document.getElementById("btn-prev").addEventListener("click", () => {
  if (current > 0) { current--; renderQuestion(); }
});
document.getElementById("btn-next").addEventListener("click", () => {
  if (current < order.length - 1) { current++; renderQuestion(); }
});
document.getElementById("btn-finish").addEventListener("click", () => {
  if (confirm("¿Finalizar el examen ahora?")) {
    clearInterval(timerId);
    finishQuiz();
  }
});

function finishQuiz() {
  if (finished) return;
  finished = true;

  let correctCount = 0;
  const failed = [];

  order.forEach((qIndex) => {
    const q = QUESTIONS[qIndex];
    const chosenIdx = answers[qIndex];
    const chosenText = chosenIdx !== undefined ? q.options[chosenIdx] : null;
    const isCorrect = chosenText !== null && q.correct_answer.includes(chosenText);
    if (isCorrect) {
      correctCount++;
    } else {
      failed.push({ title: q.title, your: chosenText, correct: q.correct_answer.join(" / ") });
    }
  });

  const pct = Math.round((correctCount / order.length) * 100);

  document.getElementById("quiz-screen").classList.add("hidden");
  document.getElementById("result-screen").classList.remove("hidden");
  document.getElementById("result-score").textContent = `${correctCount} / ${order.length} (${pct}%)`;
  document.getElementById("result-detail").textContent =
    pct >= 85 ? "Aprobado (umbral recomendado: 85%)" : "No alcanzó el umbral recomendado de 85%";

  const listEl = document.getElementById("result-list");
  listEl.innerHTML = "";
  if (failed.length === 0) {
    listEl.innerHTML = "<p>¡Todas correctas!</p>";
  } else {
    failed.forEach((f) => {
      const div = document.createElement("div");
      div.className = "qresult fail";
      div.innerHTML = `
        <div>${f.title}</div>
        <div class="ans your">Tu respuesta: ${f.your ?? "(sin responder)"}</div>
        <div class="ans correct">Respuesta correcta: ${f.correct}</div>
      `;
      listEl.appendChild(div);
    });
  }
}

document.getElementById("btn-start").addEventListener("click", startQuiz);
</script>
